x-spark-common: &spark-common
  image: apache/spark:3.5.3
  networks:
    - labnet
  volumes:
    - ./data:/data
  user: root

x-spark-novol-common: &spark-novol-common
  image: apache/spark:3.5.3
  networks:
    - labnet
  user: root

x-hadoop-common: &hadoop-common
  image: apache/hadoop:3.5.0
  user: root
  env_file:
    - ./.env
  volumes:
    - ./config/hadoop:/opt/hadoop/etc/hadoop
    - ./scripts:/scripts
    - ../data:/data
  networks:
    - labnet
  restart: unless-stopped

services:
  # ===========================================================================
  # profile "cluster" (default) — Spark Standalone (master + 2 workers) + Spark Connect
  # Sempre presente. Usado pelo Caso B (volume compartilhado).
  # Os profiles "s3" e "hadoop" reutilizam estes mesmos master/workers —
  # cada um adiciona seu próprio Spark Connect server em porta diferente.
  # ===========================================================================
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master" ]
    ports:
      - "7077:7077"
      - "8080:8080"
    profiles: [ "cluster", "s3", "hadoop" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    command:
      - /bin/bash
      - -c
      - >
        curl -sL -o /opt/spark/jars/spark-connect_2.12-3.5.3.jar https://repo1.maven.org/maven2/org/apache/spark/spark-connect_2.12/3.5.3/spark-connect_2.12-3.5.3.jar &&
        curl -sL -o /opt/spark/jars/hadoop-aws-3.3.4.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar &&
        curl -sL -o /opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar &&
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    profiles: [ "cluster", "s3", "hadoop" ]

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    command:
      - /bin/bash
      - -c
      - >
        curl -sL -o /opt/spark/jars/spark-connect_2.12-3.5.3.jar https://repo1.maven.org/maven2/org/apache/spark/spark-connect_2.12/3.5.3/spark-connect_2.12-3.5.3.jar &&
        curl -sL -o /opt/spark/jars/hadoop-aws-3.3.4.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar &&
        curl -sL -o /opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar &&
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    profiles: [ "cluster", "s3", "hadoop" ]

  spark-connect:
    <<: *spark-common
    container_name: spark-connect
    hostname: spark-connect
    command:
      - /bin/bash
      - -c
      - >
        curl -sL -o /opt/spark/jars/spark-connect_2.12-3.5.3.jar https://repo1.maven.org/maven2/org/apache/spark/spark-connect_2.12/3.5.3/spark-connect_2.12-3.5.3.jar && /opt/spark/bin/spark-submit --class org.apache.spark.sql.connect.service.SparkConnectServer --master spark://spark-master:7077 --conf spark.driver.host=spark-connect --conf spark.connect.grpc.binding.port=15002
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "15002:15002"
      - "4040:4040"
    profiles: [ "cluster" ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15002' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ===========================================================================
  # profile "s3" — RustFS + Spark Connect S3 (porta 15003).
  # Aditivo ao profile "cluster". Uso: make s3
  # ===========================================================================
  spark-connect-s3:
    <<: *spark-novol-common
    container_name: spark-connect-s3
    hostname: spark-connect-s3
    command:
      - /bin/bash
      - -c
      - >
        curl -sL -o /opt/spark/jars/spark-connect_2.12-3.5.3.jar https://repo1.maven.org/maven2/org/apache/spark/spark-connect_2.12/3.5.3/spark-connect_2.12-3.5.3.jar &&
        curl -sL -o /opt/spark/jars/hadoop-aws-3.3.4.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar &&
        curl -sL -o /opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar &&
        /opt/spark/bin/spark-submit --class org.apache.spark.sql.connect.service.SparkConnectServer --master spark://spark-master:7077 --conf spark.driver.host=spark-connect-s3 --conf spark.connect.grpc.binding.port=15003 --conf spark.hadoop.fs.s3a.endpoint=http://rustfs-server:9000 --conf spark.hadoop.fs.s3a.access.key=admin --conf spark.hadoop.fs.s3a.secret.key=adminpassword --conf spark.hadoop.fs.s3a.path.style.access=true --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "15003:15003"
      - "4041:4040"
    profiles: [ "s3" ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15003' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rustfs-perms:
    image: alpine:latest
    container_name: rustfs-perms
    user: root
    networks:
      - labnet
    volumes:
      - drive0_data:/drives/0
      - drive1_data:/drives/1
      - drive2_data:/drives/2
      - drive3_data:/drives/3
    profiles: [ "s3" ]
    command: >
      sh -c " chown -R 10001:10001 /drives/0 && chown -R 10001:10001 /drives/1 && chown -R 10001:10001 /drives/2 && chown -R 10001:10001 /drives/3 && echo 'Permissions set for all 4 drives.' "

  rustfs-server:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: rustfs-server
    hostname: rustfs-server
    command: /data/drive0 /data/drive1 /data/drive2 /data/drive3
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    networks:
      - labnet
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: adminpassword
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - drive0_data:/data/drive0
      - drive1_data:/data/drive1
      - drive2_data:/data/drive2
      - drive3_data:/data/drive3
    profiles: [ "s3" ]
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -sf http://127.0.0.1:9000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: minio/mc:latest
    container_name: rustfs-init
    networks:
      - labnet
    depends_on:
      rustfs-server:
        condition: service_healthy
    profiles: [ "s3" ]
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set rustfs http://rustfs-server:9000 admin adminpassword; /usr/bin/mc mb rustfs/bronze || true; /usr/bin/mc mb rustfs/silver || true; /usr/bin/mc mb rustfs/gold || true; echo 'Buckets bronze/silver/gold ready.'; exit 0; "

  # ===========================================================================
  # profile "hadoop" — HDFS + Spark Connect HDFS (porta 15004).
  # Reutiliza o master/workers do profile "cluster". Uso: make hadoop
  # ===========================================================================
  namenode:
    <<: *hadoop-common
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    command: [ "/bin/bash", "/scripts/start-hdfs.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.namenode.NameNode'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles: [ "hadoop" ]

  datanode1:
    <<: *hadoop-common
    container_name: datanode1
    hostname: datanode1
    depends_on:
      namenode:
        condition: service_started
    command: [ "/bin/bash", "/scripts/init-datanode.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.datanode.DataNode'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: [ "hadoop" ]

  datanode2:
    <<: *hadoop-common
    container_name: datanode2
    hostname: datanode2
    depends_on:
      namenode:
        condition: service_started
    command: [ "/bin/bash", "/scripts/init-datanode.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.datanode.DataNode'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: [ "hadoop" ]

  proxy:
    <<: *hadoop-common
    container_name: proxy
    hostname: proxy
    depends_on:
      namenode:
        condition: service_started
    ports:
      - "14000:14000"
    command: [ "hdfs", "httpfs" ]
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep -q httpfs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: [ "hadoop" ]

  spark-connect-hdfs:
    <<: *spark-novol-common
    container_name: spark-connect-hdfs
    hostname: spark-connect-hdfs
    command:
      - /bin/bash
      - -c
      - >
        curl -sL -o /opt/spark/jars/spark-connect_2.12-3.5.3.jar https://repo1.maven.org/maven2/org/apache/spark/spark-connect_2.12/3.5.3/spark-connect_2.12-3.5.3.jar && /opt/spark/bin/spark-submit --class org.apache.spark.sql.connect.service.SparkConnectServer --master spark://spark-master:7077 --conf spark.driver.host=spark-connect-hdfs --conf spark.connect.grpc.binding.port=15004 --conf spark.hadoop.fs.defaultFS=hdfs://namenode:8020 --conf spark.hadoop.dfs.client.use.datanode.hostname=true
    depends_on:
      spark-master:
        condition: service_healthy
      namenode:
        condition: service_started
    ports:
      - "15004:15004"
      - "4042:4040"
    profiles: [ "hadoop" ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15004' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

networks:
  labnet:
    driver: bridge

volumes:
  drive0_data:
    driver: local
  drive1_data:
    driver: local
  drive2_data:
    driver: local
  drive3_data:
    driver: local
