x-spark-common: &spark-common
  image: apache/spark:3.5.3
  networks:
    - labnet
  volumes:
    - ./data:/data
  user: root

x-hadoop-common: &hadoop-common
  image: apache/hadoop:3.5.0
  user: root
  env_file:
    - ./.env
  volumes:
    - ./config/hadoop:/opt/hadoop/etc/hadoop
    - ./scripts:/scripts
  networks:
    - labnet
  restart: unless-stopped

services:
  # ===========================================================================
  # profile "cluster" — Spark Standalone (master + 2 workers) + Spark Connect
  # Usado pelo Caso B (cluster + volume compartilhado) e Caso D (cluster + S3,
  # adicione o profile "s3" sobre este).
  # ===========================================================================
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077" # RPC do Spark master — spark://localhost:7077
      - "8080:8080" # Web UI do Master
    profiles: ["cluster"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081" # Web UI do Worker
    profiles: ["cluster"]

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081" # Web UI do Worker (mapeada para uma porta host diferente)
    profiles: ["cluster"]

  spark-connect:
    <<: *spark-common
    container_name: spark-connect
    hostname: spark-connect
    command: >
      /opt/spark/bin/spark-submit
      --class org.apache.spark.sql.connect.service.SparkConnectServer
      --packages org.apache.spark:spark-connect_2.12:3.5.3
      --master spark://spark-master:7077
      --conf spark.driver.host=spark-connect
      --conf spark.connect.grpc.binding.port=15002
      --conf spark.hadoop.fs.s3a.endpoint=http://rustfs-server:9000
      --conf spark.hadoop.fs.s3a.access.key=admin
      --conf spark.hadoop.fs.s3a.secret.key=adminpassword
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "15002:15002" # Endpoint gRPC do Spark Connect — sc://localhost:15002
      - "4040:4040" # Spark UI para o driver da sessão Connect
    profiles: ["cluster"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15002' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ===========================================================================
  # profile "s3" — RustFS single node, 4 drives, Erasure Coding RS(4,2).
  # Mesmo padrão do cdn-s3-lab. Aditivo ao profile "cluster" -> Caso D.
  # A configuração do conector s3a acima (no spark-connect) já aponta para
  # rustfs-server, então este profile só precisa ser *adicionado*, não substituído.
  # ===========================================================================
  rustfs-perms:
    image: alpine:latest
    container_name: rustfs-perms
    user: root
    networks:
      - labnet
    volumes:
      - drive0_data:/drives/0
      - drive1_data:/drives/1
      - drive2_data:/drives/2
      - drive3_data:/drives/3
    profiles: ["s3"]
    command: >
      sh -c "
      chown -R 10001:10001 /drives/0 &&
      chown -R 10001:10001 /drives/1 &&
      chown -R 10001:10001 /drives/2 &&
      chown -R 10001:10001 /drives/3 &&
      echo 'Permissions set for all 4 drives.'
      "

  rustfs-server:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: rustfs-server
    hostname: rustfs-server
    command: /data/drive0 /data/drive1 /data/drive2 /data/drive3
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    networks:
      - labnet
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: adminpassword
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - drive0_data:/data/drive0
      - drive1_data:/data/drive1
      - drive2_data:/data/drive2
      - drive3_data:/data/drive3
    profiles: ["s3"]
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: minio/mc:latest
    container_name: rustfs-init
    networks:
      - labnet
    depends_on:
      rustfs-server:
        condition: service_healthy
    profiles: ["s3"]
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set rustfs http://rustfs-server:9000 admin adminpassword;
      /usr/bin/mc mb rustfs/bronze || true;
      /usr/bin/mc mb rustfs/silver || true;
      /usr/bin/mc mb rustfs/gold || true;
      echo 'Buckets bronze/silver/gold ready.';
      exit 0;
      "

  # ===========================================================================
  # profile "hadoop" — HDFS + YARN, reduzido para 2 DataNodes / 2 NodeManagers.
  # Usado exclusivamente pelo Caso C. Isolado do "cluster" — o Spark aqui
  # executa *dentro* de containers YARN, não como serviços spark-worker pré-existentes.
  # ===========================================================================
  namenode:
    <<: *hadoop-common
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870" # Web UI do NameNode
      - "8020:8020" # RPC do NameNode
    command: ["/bin/bash", "/scripts/start-hdfs.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.namenode.NameNode'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles: ["hadoop"]

  datanode1:
    <<: *hadoop-common
    container_name: datanode1
    hostname: datanode1
    depends_on:
      namenode:
        condition: service_started
    command: ["/bin/bash", "/scripts/init-datanode.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.datanode.DataNode'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

  datanode2:
    <<: *hadoop-common
    container_name: datanode2
    hostname: datanode2
    depends_on:
      namenode:
        condition: service_started
    command: ["/bin/bash", "/scripts/init-datanode.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.hdfs.server.datanode.DataNode'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

  resourcemanager:
    <<: *hadoop-common
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088" # Web UI do ResourceManager
      - "8032:8032" # RPC do cliente (submissão de jobs) — usado pelo driver do host, veja config/hadoop-client/
      - "8030:8030" # RPC do Scheduler — usado pelo driver do host
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.yarn.server.resourcemanager.ResourceManager'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

  nodemanager1:
    <<: *hadoop-common
    container_name: nodemanager1
    hostname: nodemanager1
    command: ["yarn", "nodemanager"]
    depends_on:
      resourcemanager:
        condition: service_started
    # Executores e o ApplicationMaster executam como processos dentro deste
    # container. host.docker.internal permite que eles se conectem ao Spark
    # driver, que executa no HOST para todos os casos deste laboratório
    # (veja docs/07).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Jars do Spark, montados como bind read-only do uv venv do host (veja
    # `spark.yarn.jars=local:/opt/spark-jars/*` em lab_utils.py). Isso permite
    # que o ApplicationMaster/executores encontrem as classes do Spark
    # localmente em vez do YARN tentar distribuí-las via HDFS — o que
    # gravaria uma URI "localhost:14000" da perspectiva do driver que
    # significa algo diferente dentro deste container (veja docs/07). Requer
    # que `make setup-env` tenha sido executado pelo menos uma vez antes de
    # `make up-hadoop`.
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./scripts:/scripts
      - ./.venv/lib/python3.12/site-packages/pyspark/jars:/opt/spark-jars:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.yarn.server.nodemanager.NodeManager'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

  nodemanager2:
    <<: *hadoop-common
    container_name: nodemanager2
    hostname: nodemanager2
    command: ["yarn", "nodemanager"]
    depends_on:
      resourcemanager:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./scripts:/scripts
      - ./.venv/lib/python3.12/site-packages/pyspark/jars:/opt/spark-jars:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'org.apache.hadoop.yarn.server.nodemanager.NodeManager'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

  proxy:
    <<: *hadoop-common
    container_name: proxy
    hostname: proxy
    depends_on:
      namenode:
        condition: service_started
    ports:
      - "14000:14000" # Gateway HttpFS (WebHDFS REST) — o ÚNICO ponto de entrada HDFS que o Spark driver do host usa
    command: ["hdfs", "httpfs"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q httpfs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["hadoop"]

networks:
  labnet:
    driver: bridge

volumes:
  drive0_data:
    driver: local
  drive1_data:
    driver: local
  drive2_data:
    driver: local
  drive3_data:
    driver: local
