[project]
name = "cdn-spark-lab"
version = "1.0.0"
description = "Laboratório prático Apache Spark — do PySpark local aos clusters Standalone, YARN+HDFS e S3"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.1",
    # PySpark 3.5.x's toPandas()/Arrow path still imports `distutils`, which
    # was removed from the stdlib in Python 3.12. setuptools vendors a shim
    # (`setuptools._distutils`) that restores it — required on Python 3.12+.
    "setuptools>=69.0",
    "pyspark[connect]>=3.5.3,<3.6",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "faker>=24.0",
    "boto3>=1.34",
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "hdfs>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbmake>=1.5",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
